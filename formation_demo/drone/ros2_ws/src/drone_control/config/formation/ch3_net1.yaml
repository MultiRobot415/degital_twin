# 論文 第3章（1次システムのフォーメーション）の合意制御則・ネットワーク構造 NET1（図 3.3(a)）
#
#   制御則・隊形の式は ch3_net2.yaml と同じ（式 3.5, 3.22）。違うのはネットワーク構造だけ。
#
#   NET1: 全機が Leader の情報を直接得る。機体間はすべて双方向（仮定 3.2）。
#
#       Leader → tello1, tello2, tello3
#       tello1 ⇄ tello2 ⇄ tello3
#
# 座標は ROS 規約（x=前, y=左, z=上, world）。θ は Leader の進行方向から反時計回り（= 左回り）。
# 実行: ros2 launch drone_control formation.launch.py formation:=ch3_net1

law: consensus_ch3
description: ch3_net1

control:
  rate_hz: 20.0
  k: 1.0
  max_speed: {xy: 0.3, z: 0.3}
  k_yaw: 1.0
  goal_yaw: 0.0
  max_cmd_yaw: 0.5

shape:
  rotate_with_leader: true

agents:
  tello1:
    distance: 0.4
    azimuth_deg: 0
    leader: true
    neighbors: [tello2]
  tello2:
    distance: 0.4
    azimuth_deg: 270        # Leader の右（ch3_net2.yaml の注記どおり表 3.2 を左右反転）
    leader: true
    neighbors: [tello1, tello3]
  tello3:
    distance: 0.4
    azimuth_deg: 90         # Leader の左
    leader: true
    neighbors: [tello2]
